[profile.default]
src = "src"
out = "out"
libs = ["lib"]
script = "script"
test = "test"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
# Foundry tests read the checked-in email fixtures directly (vm.readFileBinary).
fs_permissions = [{ access = "read", path = "./fixtures" }]

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = false

[fuzz]
runs = 256

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
gnosis = "${GNOSIS_RPC_URL}"
