# Etherform minimum setup (build + test + fmt) per
# https://github.com/BreadchainCoop/etherform — see docs/OPERATIONS.md.
# Deploys are intentionally NOT enabled on PR: Arbitrum One deploys are a
# manual operator action with the key only in local env.
name: CI/CD
on: [push, pull_request]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cicd:
    uses: BreadchainCoop/etherform/.github/workflows/_foundry-cicd.yml@main
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install application dependencies
        run: |
          npm --prefix web ci
          npm --prefix e2e ci
          npm --prefix agent ci
      - name: Web app (neighborhood policies)
        run: |
          npm --prefix web run typecheck
          npm --prefix web run lint
          npm --prefix web test
          npm --prefix web run build
          npm --prefix web run check:dist
      - name: Policy browser suite compiles
        # The suite itself needs an Arbitrum fork (npm --prefix e2e run e2e:policies).
        run: npm --prefix e2e run typecheck
      - name: Operator scripts and agent
        run: |
          node --test scripts/v4-targets.test.mjs
          npm --prefix agent test
      - name: Direct v4 quoting lifecycle
        run: npm --prefix agent run test:v4:local
