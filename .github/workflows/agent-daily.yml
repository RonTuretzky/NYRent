# agent-daily — daily market-maker run for NY Rent Cover (see agent/README.md).
#
# Every run is a DRY RUN: collectors hit their real endpoints, chain state is
# read per target (Gnosis WXDAI + Arbitrum USDC — the permissionless CoverPool
# has NO roles; the agent is one underwriter/buyer wallet among any number),
# the deterministic two-sided policy prints its Plan per target, and the run
# report is uploaded as an artifact. NOTHING is written on-chain. The dry run
# gets its identity from public ADDRESSES below (never keys): the policy
# refuses to plan without knowing which wallet the book belongs to.
#
# Execution is a separate, operator-opt-in path: trigger workflow_dispatch with
# execute=true. It requires the DEPLOYER_PRIVATE_KEY repository secret (the
# agent's underwriter wallet key on direct targets; BANKR_API_KEY enables the
# Bankr advisory + the read-only /wallet/me identity check — live Bankr-custody
# execution additionally needs the explicit BANKR_EXECUTE=1 opt-in and is NOT
# part of this workflow). Secrets are passed via step env only and are never
# echoed; run.mjs never prints key material.
name: agent-daily

on:
  schedule:
    - cron: "0 13 * * *" # 13:00 UTC, after CRE Daily's morning send
  workflow_dispatch:
    inputs:
      execute:
        description: "Execute the plan on-chain (operator opt-in; needs DEPLOYER_PRIVATE_KEY secret)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: agent-daily
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json

      - name: Install agent dependencies
        working-directory: agent
        run: npm ci

      - name: Policy unit tests
        working-directory: agent
        run: npm run test:policy

      - name: Dry run (always — real signals, real chain reads per target, no transactions)
        working-directory: agent
        env:
          GNOSIS_RPC_URL: https://rpc.gnosischain.com
          ARBITRUM_RPC_URL: https://arb1.arbitrum.io/rpc
          # Identity WITHOUT keys (public addresses — the policy refuses to plan
          # a book it cannot attribute to a wallet): the Gnosis underwriter
          # wallet and the Bankr-custodied Arbitrum wallet.
          AGENT_ADDRESS_GNOSIS: "0x6636A1CCBdf54485067304C1a590DE016DeaD9F0"
          BANKR_WALLET: "0x1a7223bc942b053794e17b537e73d837cf695561"
        run: node run.mjs

      # Operator opt-in execution. Exit code 2 means "acted" and is success.
      - name: Execute plan (workflow_dispatch with execute=true only)
        if: github.event_name == 'workflow_dispatch' && inputs.execute
        working-directory: agent
        env:
          GNOSIS_RPC_URL: https://rpc.gnosischain.com
          ARBITRUM_RPC_URL: https://arb1.arbitrum.io/rpc
          BANKR_WALLET: "0x1a7223bc942b053794e17b537e73d837cf695561"
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          BANKR_API_KEY: ${{ secrets.BANKR_API_KEY }}
        run: |
          if [ -z "$DEPLOYER_PRIVATE_KEY" ]; then
            echo "::error::execute=true but the DEPLOYER_PRIVATE_KEY secret is not configured"
            exit 1
          fi
          set +e
          # Execution from CI is scoped to the direct target: live Bankr-custody
          # execution (arbitrum) is a deliberate manual operator action, never CI.
          node run.mjs --execute gnosis
          code=$?
          set -e
          case "$code" in
            0) echo "Plan was a no-op — nothing to execute." ;;
            2) echo "Plan executed on-chain (exit 2 = acted)." ;;
            3) echo "::error::Agent refused to execute (exit 3) — no transactions were sent; see the run report artifact."; exit 3 ;;
            4) echo "::error::PARTIAL execution (exit 4) — some transactions LANDED before the batch aborted. Chain state changed and does not match the plan; check the landed tx hashes in the run report artifact before re-running."; exit 4 ;;
            *) echo "::error::Runner failed with exit $code"; exit "$code" ;;
          esac

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-run-${{ github.run_id }}
          path: agent/runs/*.json
          if-no-files-found: warn
          retention-days: 90
